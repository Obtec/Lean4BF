services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lean4bf-app
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - lean4bf-network

  nginx:
    image: nginx:alpine
    container_name: lean4bf-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - lean4bf-network

networks:
  lean4bf-network:
    driver: bridge
